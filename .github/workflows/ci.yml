name: Spring Boot CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачать код репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Установить Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Собрать проект и прогнать тесты
      - name: Build and run tests
        run: mvn clean verify
