name: Spring Boot CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      CREDENTIALS_FILE_PATH: ${{ secrets.SPREADSHEET_ID }}
      BYBIT_API_KEY: ${{ secrets.SPREADSHEET_ID }}
      BYBIT_API_SECRET: ${{ secrets.SPREADSHEET_ID }}

    steps:
      # Скачать код репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # Установить Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Создать секретный файл
      - name: Create credentials file google-credentials.json
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > google-credentials.json

      # Собрать проект и прогнать тесты
      - name: Build and run tests
        run: mvn clean verify
