name: CI/CD Spring Boot

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  # ======== CI ========
  build:
    runs-on: ubuntu-latest

    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
      BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 with Maven cache
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Create google-credentials.json
        run: |
          mkdir -p src/main/resources/secrets
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > src/main/resources/secrets/google-credentials.json

      - name: Build and run tests
        run: mvn clean verify

  # ======== Deploy ========
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/prime_worker_app
            git pull origin master
            docker compose build

            service_pid="$(systemctl show --property MainPID --value prime-worker.service 2>/dev/null || true)"
            if [ -n "$service_pid" ] && [ "$service_pid" != "0" ] && kill -0 "$service_pid" 2>/dev/null; then
              kill -TERM "$service_pid"
              restarted=false
              for i in $(seq 1 60); do
                next_pid="$(systemctl show --property MainPID --value prime-worker.service 2>/dev/null || true)"
                if [ -n "$next_pid" ] && [ "$next_pid" != "0" ] && [ "$next_pid" != "$service_pid" ]; then
                  restarted=true
                  break
                fi
                sleep 1
              done
              if [ "$restarted" != "true" ]; then
                echo "prime-worker.service did not restart after stopping docker compose"
                exit 1
              fi
            else
              docker compose up -d --build
            fi

            for i in $(seq 1 60); do
              if docker compose ps --status running --services | grep -qx "prime-worker"; then
                docker compose ps
                exit 0
              fi
              sleep 2
            done

            docker compose ps
            exit 1
