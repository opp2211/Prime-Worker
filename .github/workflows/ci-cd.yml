name: CI/CD Spring Boot

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  # ======== CI ========
  build:
    runs-on: ubuntu-latest

    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
      BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 with Maven cache
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Create google-credentials.json
        run: |
          mkdir -p src/main/resources/secrets
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > src/main/resources/secrets/google-credentials.json

      - name: Build and run tests
        run: mvn clean verify

  # ======== Deploy ========
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/prime-worker
            git pull origin master
            docker compose build
            sudo -n /usr/bin/systemctl restart prime-worker.service

            for i in $(seq 1 60); do
              if systemctl is-active --quiet prime-worker.service && docker compose ps --status running --services | grep -qx "prime-worker"; then
                docker compose ps
                exit 0
              fi
              sleep 2
            done

            systemctl status prime-worker.service --no-pager || true
            docker compose ps
            exit 1
